[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-legal-rag"
version = "0.1.0"
description = "Research pipeline for VLSP 2025 multimodal legal retrieval and QA"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
